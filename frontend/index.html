<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rate Limiter Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-10 font-mono">

  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-2"> Rate Limiter Demo</h1>
    <p class="text-gray-400 mb-8">10 requests / 60 seconds. Try hitting the limit.</p>

    <!-- Algorithm Selector -->
    <div class="flex gap-3 mb-6">
      <button onclick="setAlgo('fixed-window')"   id="btn-fixed-window"   class="algo-btn px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500">Fixed Window</button>
      <button onclick="setAlgo('sliding-window')" id="btn-sliding-window" class="algo-btn px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Sliding Window</button>
      <button onclick="setAlgo('token-bucket')"   id="btn-token-bucket"   class="algo-btn px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Token Bucket</button>
    </div>

    <!-- Fire Request Button -->
    <button id="fire-btn" onclick="fireRequest()" class="w-full py-3 bg-green-600 hover:bg-green-500 rounded text-lg font-bold mb-6">
  Fire Request →
     </button>

    <!-- Status Bar -->
    <div id="status-bar" class="mb-4 h-4 rounded bg-gray-800 overflow-hidden">
      <div id="status-fill" class="h-full bg-green-500 transition-all duration-300" style="width:0%"></div>
    </div>
    <p id="status-text" class="text-gray-400 text-sm mb-6">No requests yet.</p>

    <div id="timer-container" class="hidden mb-6 text-center">
  <p class="text-red-400 text-sm mb-2">Next request window opens in</p>
  <div id="timer-display" class="text-5xl font-bold text-red-400 tabular-nums">60</div>
  <div class="w-full bg-gray-800 rounded h-2 mt-3">
    <div id="timer-bar" class="h-2 rounded bg-red-500 transition-all duration-1000" style="width:100%"></div>
  </div>
    </div>

    <!-- Response Log -->
    <div id="log" class="space-y-2 max-h-80 overflow-y-auto"></div>
  </div>

<script>
  let algo = 'fixed-window';
  let isFiring = false;
  let timerInterval = null;

  function setAlgo(name) {
    algo = name;
    document.getElementById('log').innerHTML = '';
    document.getElementById('status-text').textContent = 'Switched to ' + name;
    document.getElementById('status-fill').style.width = '0%';
    document.getElementById('status-fill').className = 'h-full transition-all duration-300 bg-green-500';
    document.querySelectorAll('.algo-btn').forEach(b => {
      b.classList.remove('bg-indigo-600');
      b.classList.add('bg-gray-700');
    });
    document.getElementById('btn-' + name).classList.remove('bg-gray-700');
    document.getElementById('btn-' + name).classList.add('bg-indigo-600');
    stopTimer();
  }

  function startTimer(seconds) {
    const container = document.getElementById('timer-container');
    const display = document.getElementById('timer-display');
    const bar = document.getElementById('timer-bar');
    const btn = document.getElementById('fire-btn');
    const total = seconds;

    container.classList.remove('hidden');
    btn.disabled = true;
    btn.textContent = `Locked for ${seconds}s`;

    let remaining = seconds;
    display.textContent = remaining;
    bar.style.width = '100%';

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      remaining -= 1;
      display.textContent = remaining;
      bar.style.width = `${(remaining / total) * 100}%`;
      btn.textContent = `Locked for ${remaining}s`;

      if (remaining <= 0) {
        stopTimer();
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    document.getElementById('timer-container').classList.add('hidden');
    const btn = document.getElementById('fire-btn');
    btn.disabled = false;
    btn.textContent = 'Fire Request →';
    document.getElementById('status-text').textContent = 'Window reset — fire again!';
    document.getElementById('status-fill').style.width = '0%';
    document.getElementById('status-fill').className = 'h-full transition-all duration-300 bg-green-500';
  }

  async function fireRequest() {
    if (isFiring) return;
    isFiring = true;

    const btn = document.getElementById('fire-btn');
    btn.disabled = true;
    btn.textContent = 'Firing...';

    try {
      const res = await fetch(`/api/${algo}`);
      const data = await res.json();
      const allowed = res.status !== 429;
      const count = data.count || 0;
      const max = 10;
      const pct = Math.min((count / max) * 100, 100);
      const fill = document.getElementById('status-fill');
      fill.style.width = pct + '%';
      fill.className = `h-full transition-all duration-300 ${allowed ? 'bg-green-500' : 'bg-red-500'}`;

      if (!allowed) {
        const retryAfter = data.retry_after || 60;
        document.getElementById('status-text').textContent = `❌ Rate limit hit`;
        startTimer(retryAfter);
      } else {
        document.getElementById('status-text').textContent = `${count}/${max} requests used`;
        btn.disabled = false;
        btn.textContent = 'Fire Request →';
      }

      appendLog(data, allowed, res.status);
    } catch (err) {
      appendLog({ error: 'Request failed' }, false, 500);
      btn.disabled = false;
      btn.textContent = 'Fire Request →';
    } finally {
      isFiring = false;
    }
  }

  function appendLog(data, allowed, status) {
    const log = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = `p-3 rounded text-sm ${allowed ? 'bg-gray-800' : 'bg-red-900/40 border border-red-700'}`;
    entry.innerHTML = `
      <span class="${allowed ? 'text-green-400' : 'text-red-400'}">${status} ${allowed ? '✓ ALLOWED' : '✗ BLOCKED'}</span>
      <span class="text-gray-400 ml-4">${JSON.stringify(data)}</span>
    `;
    log.prepend(entry);
  }
</script>
</body>
</html>
